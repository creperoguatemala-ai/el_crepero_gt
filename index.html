            { id: 32, cat: 'bebidas', name: 'Coffee Ice', desc: 'Frío', price: 25 },
            { id: 33, cat: 'bebidas', name: 'Copa de Vino', desc: 'Tinto/Blanco', price: 20 },
            { id: 34, cat: 'bebidas', name: 'Té de la Casa', desc: 'Infusión', price: 12 },
            { id: 35, cat: 'bebidas', name: 'Coca Cola', desc: 'Lata/Botella', price: 12 },
            { id: 36, cat: 'bebidas', name: 'Jamaica', desc: 'Bebida fría', price: 15 },
            { id: 37, cat: 'bebidas', name: 'Cerveza Moza', desc: 'Cerveza', price: 18 }
        ];

        function formatTime(isoStr) {
            if (!isoStr) return '--:--';
            return new Date(isoStr).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
        }

        const todayDateStr = new Date().toISOString().split('T')[0];

        // Escuchar Mesas
        onValue(ref(db, 'mesas_activas/'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                tablesState = data;
            } else {
                initialTables.forEach(t => tablesState[t.id] = { items: [], startTime: null });
            }
            renderCroquis();
            if (currentTableId) updateCartUI();
        });

        // Escuchar Historial
        onValue(ref(db, `ventas_diarias/${todayDateStr}`), (snapshot) => {
            const data = snapshot.val();
            dailyHistory = data ? Object.values(data) : [];
            if (document.getElementById('historyView').classList.contains('active')) {
                renderHistory();
            }
        });

        // RENDER DEL CROQUIS EXACTO SEGÚN DIBUJO
        function createCardHTML(table) {
            const state = tablesState[table.id] || { items: [], startTime: null };
            const items = state.items || [];
            const isBusy = items.length > 0;
            const total = items.reduce((sum, item) => sum + (item.price * item.qty), 0);

            return `
                <div class="table-card ${isBusy ? 'busy' : 'free'} ${table.id === 9 ? 'takeaway' : ''}" onclick="openPOS(${table.id})">
                    <div class="table-number">${table.name}</div>
                    <div class="table-status">${isBusy ? 'Ocupada' : 'Libre'}</div>
                    ${isBusy ? `<div class="table-time">⏱️ ${formatTime(state.startTime)}</div>` : ''}
                    ${isBusy ? `<div class="table-total">Q ${total.toFixed(2)}</div>` : ''}
                </div>
            `;
        }

        function renderCroquis() {
            const leftZone = document.getElementById('leftBarZone');
            const centerZone = document.getElementById('centerTablesZone');
            const takeawayZone = document.getElementById('takeawayZone');

            if (!leftZone || !centerZone || !takeawayZone) return;

            // 1. Render Barras 1 y 2 (Izquierda) - En orden de arriba a abajo
            const leftTables = initialTables.filter(t => t.zone === 'left').reverse();
            leftZone.innerHTML = leftTables.map(t => createCardHTML(t)).join('');

            // 2. Render Mesas Centrales (3, 4, 5 a la izq / 8, 7, 6 a la der)
            const centerOrder = [
                initialTables.find(t => t.id === 5), // Arriba Izq
                initialTables.find(t => t.id === 6), // Arriba Der
                initialTables.find(t => t.id === 4), // Centro Izq
                initialTables.find(t => t.id === 7), // Centro Der
                initialTables.find(t => t.id === 3), // Abajo Izq
                initialTables.find(t => t.id === 8)  // Abajo Der
            ];
            centerZone.innerHTML = centerOrder.map(t => createCardHTML(t)).join('');

            // 3. Para Llevar (Abajo)
            const takeawayObj = initialTables.find(t => t.id === 9);
            takeawayZone.innerHTML = createCardHTML(takeawayObj);
        }

        // VINCULACIÓN GLOBAL WINDOW
        window.showTablesView = function() {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('tablesView').classList.add('active');
            document.getElementById('btnSwitchView').style.display = 'none';
            document.getElementById('btnHistoryView').style.display = 'flex';
            document.getElementById('activeTableLabel').innerText = '';
            renderCroquis();
        };

        window.showHistoryView = function() {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('historyView').classList.add('active');
            document.getElementById('btnSwitchView').style.display = 'none';
            document.getElementById('btnHistoryView').style.display = 'none';
            document.getElementById('activeTableLabel').innerText = '';
            renderHistory();
        };

        window.openPOS = function(tableId) {
            currentTableId = tableId;
            const tableObj = initialTables.find(t => t.id === tableId);

            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('posView').classList.add('active');
            document.getElementById('btnSwitchView').style.display = 'flex';
            document.getElementById('btnHistoryView').style.display = 'none';
            document.getElementById('activeTableLabel').innerText = tableObj.name;
            document.getElementById('posTableTitle').innerText = `Orden - ${tableObj.name}`;

            renderMenuGrid();
            updateCartUI();
        };

        function renderHistory() {
            const list = document.getElementById('historyList');
            if (!list) return;
            list.innerHTML = '';

            let grandTotal = 0;

            dailyHistory.slice().reverse().forEach(order => {
                grandTotal += order.total;

                const card = document.createElement('div');
                card.className = 'history-card';
                card.innerHTML = `
                    <div class="history-card-header">
                        <span>${order.tableName}</span>
                        <span style="color: #ff9800;">Q ${order.total.toFixed(2)}</span>
                    </div>
                    <div class="history-times">
                        <span>⏱️ Inicio: ${formatTime(order.startTime)}</span>
                        <span>🏁 Cierre: ${formatTime(order.endTime)}</span>
                    </div>
                    <div class="history-items">
                        ${order.items ? order.items.map(i => `${i.qty}x ${i.name}`).join(' • ') : ''}
                    </div>
                `;
                list.appendChild(card);
            });

            document.getElementById('summaryCount').innerText = dailyHistory.length;
            document.getElementById('summaryTotal').innerText = `Q ${grandTotal.toFixed(2)}`;
        }

        function renderMenuGrid() {
            const grid = document.getElementById('itemsGrid');
            if (!grid) return;
            grid.innerHTML = '';

            const filtered = currentCat === 'all' ? menu : menu.filter(i => i.cat === currentCat);

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.onclick = () => addToCart(item);
                card.innerHTML = `
                    <div>
                        <div class="item-title">${item.name}</div>
                        <div class="item-sub">${item.desc}</div>
                    </div>
                    <div class="item-price">Q ${item.price.toFixed(2)}</div>
                `;
                grid.appendChild(card);
            });
        }

        window.filterCat = function(cat) {
            currentCat = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');
            renderMenuGrid();
        };

        function addToCart(item) {
            let state = tablesState[currentTableId] || { items: [], startTime: null };
            if (!state.items) state.items = [];

            if (!state.startTime) {
                state.startTime = new Date().toISOString();
            }

            const existing = state.items.find(i => i.id === item.id);
            if (existing) {
                existing.qty++;
            } else {
                state.items.push({ ...item, qty: 1 });
            }

            tablesState[currentTableId] = state;
            updateCartUI();
        }

        window.updateQty = function(id, delta) {
            let state = tablesState[currentTableId];
            if (!state || !state.items) return;

            const item = state.items.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    state.items = state.items.filter(i => i.id !== id);
                }
            }
            if (state.items.length === 0) {
                state.startTime = null;
            }
            updateCartUI();
        };

        function updateCartUI() {
            const cartContainer = document.getElementById('cartItems');
            if (!cartContainer) return;
            cartContainer.innerHTML = '';

            let state = tablesState[currentTableId] || { items: [], startTime: null };
            let cart = state.items || [];
            let total = 0;

            cart.forEach(item => {
                total += item.price * item.qty;

                const row = document.createElement('div');
                row.className = 'cart-item';
                row.innerHTML = `
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-price">Q ${item.price.toFixed(2)} c/u</div>
                    </div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                        <span class="qty-val">${item.qty}</span>
                        <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                    </div>
                `;
                cartContainer.appendChild(row);
            });

            document.getElementById('totalPrice').innerText = `Q ${total.toFixed(2)}`;
            document.getElementById('posStartTime').innerText = state.startTime ? `Inicio: ${formatTime(state.startTime)}` : 'Inicio: --:--';
        }

        window.clearCurrentCart = function() {
            tablesState[currentTableId] = { items: [], startTime: null };
            set(ref(db, `mesas_activas/${currentTableId}`), tablesState[currentTableId]);
            updateCartUI();
        };

        window.saveOrderToTable = function() {
            const state = tablesState[currentTableId];
            const tableName = initialTables.find(t => t.id === currentTableId).name;

            if (!state || !state.items || state.items.length === 0) {
                alert(`No hay ítems en la orden de ${tableName}.`);
                return;
            }

            set(ref(db, `mesas_activas/${currentTableId}`), state);
            alert(`¡Orden de ${tableName} guardada en Firebase!`);
            showTablesView();
        };

        window.payAndFreeTable = function() {
            const state = tablesState[currentTableId];
            const tableName = initialTables.find(t => t.id === currentTableId).name;

            if (!state || !state.items || state.items.length === 0) {
                alert(`La ${tableName} está vacía.`);
                return;
            }

            const endTime = new Date().toISOString();
            const total = state.items.reduce((sum, item) => sum + (item.price * item.qty), 0);

            if (confirm(`¿Cobrar y liberar ${tableName}?\nTotal: Q ${total.toFixed(2)}`)) {
                const orderData = {
                    tableName: tableName,
                    startTime: state.startTime,
                    endTime: endTime,
                    total: total,
                    items: [...state.items]
                };

                push(ref(db, `ventas_diarias/${todayDateStr}`), orderData);
                set(ref(db, `mesas_activas/${currentTableId}`), { items: [], startTime: null });

                alert(`${tableName} liberada y guardada en el historial de Firebase.`);
                showTablesView();
            }
        };

        window.exportDailyCSV = function() {
            if (dailyHistory.length === 0) {
                alert('No hay ventas registradas en el día para exportar.');
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Orden,Mesa/Ubicacion,Hora Inicio,Hora Cierre,Detalle de Productos,Total (Q)\n";

            let grandTotal = 0;

            dailyHistory.forEach((order, index) => {
                grandTotal += order.total;
                const itemsStr = order.items ? order.items.map(i => `${i.qty}x ${i.name}`).join(' | ') : '';
                const row = `${index + 1},"${order.tableName}","${formatTime(order.startTime)}","${formatTime(order.endTime)}","${itemsStr}",${order.total.toFixed(2)}`;
                csvContent += row + "\n";
            });

            csvContent += `\n,,,"TOTAL DEL DIA:",${dailyHistory.length} Ordenes,Q ${grandTotal.toFixed(2)}\n`;

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Cierre_Caja_${todayDateStr}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        window.resetDay = function() {
            if (confirm('⚠️ ¿Estás seguro de reiniciar el día?\nEsto limpiará las ventas registradas del día actual.')) {
                set(ref(db, `ventas_diarias/${todayDateStr}`), null);
                alert('Cierre de día reiniciado.');
            }
        };

        // Render inicial
        renderCroquis();
    </script>
</body>
</html>
