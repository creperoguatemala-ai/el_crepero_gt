<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menú Digital - El Crepero</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: #f3f3f3;
            background-image: radial-gradient(circle at 10% 20%, rgba(0, 120, 212, 0.08) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(16, 124, 65, 0.06) 0%, transparent 40%);
            background-attachment: fixed;
            color: #202020; 
            padding-bottom: 110px; 
        }
        
        header { 
            background: rgba(243, 243, 243, 0.85); 
            backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(0, 0, 0, 0.08); 
            padding: 12px; 
            text-align: center; 
            position: sticky; 
            top: 0; 
            z-index: 20; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); 
        }
        .logo { height: 30px; }
        .table-banner { background: #0078d4; color: #fff; font-weight: 700; padding: 9px; font-size: 0.85rem; text-align: center; text-transform: uppercase; letter-spacing: 1px; }

        .categories-bar { 
            display: flex; 
            gap: 8px; 
            padding: 12px 16px; 
            overflow-x: auto; 
            background: rgba(255, 255, 255, 0.6); 
            backdrop-filter: blur(15px); 
            position: sticky; 
            top: 67px; 
            z-index: 15; 
            border-bottom: 1px solid rgba(0, 0, 0, 0.06); 
        }
        .categories-bar::-webkit-scrollbar { display: none; }
        
        .cat-btn { 
            background: #ffffff; 
            color: #323130; 
            border: 1px solid rgba(0, 0, 0, 0.1); 
            padding: 6px 16px; 
            border-radius: 6px; 
            font-weight: 600; 
            font-size: 0.82rem; 
            white-space: nowrap; 
            transition: 0.15s; 
            cursor: pointer; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .cat-btn.active { background: #0078d4; color: #fff; border-color: #0078d4; box-shadow: 0 2px 8px rgba(0, 120, 212, 0.3); }
        .cat-btn.season { background: #fde7e9; color: #a80000; border-color: #f8939c; }
        .cat-btn.season.active { background: #a80000; color: #fff; box-shadow: 0 2px 8px rgba(168, 0, 0, 0.3); }

        .items-grid { padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 14px; }
        
        .item-card { 
            background: #ffffff; 
            border: 1px solid rgba(0, 0, 0, 0.08); 
            border-radius: 8px; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            min-height: 155px; 
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03); 
        }
        .item-card.season-card { border-color: #f8939c; background: #fff9f9; }
        
        .item-title { font-weight: 700; font-size: 0.95rem; color: #1b1b1b; line-height: 1.25; margin-bottom: 4px; }
        .item-desc { font-size: 0.72rem; font-weight: 400; color: #605e5c; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px; }
        .item-price { color: #d83b01; font-weight: 700; font-size: 1.05rem; }
        .btn-add { background: #0078d4; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: 700; width: 100%; margin-top: 8px; font-size: 0.88rem; cursor: pointer; box-shadow: 0 2px 6px rgba(0, 120, 212, 0.3); transition: 0.15s; }
        .btn-add:hover { background: #106ebe; }

        /* MODAL */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); z-index: 100; justify-content: center; align-items: flex-end; backdrop-filter: blur(5px); }
        .modal.active { display: flex; }
        .modal-content { 
            background: #ffffff; 
            border: 1px solid rgba(0, 0, 0, 0.15); 
            border-radius: 12px 12px 0 0; 
            padding: 22px 18px; 
            width: 100%; 
            max-width: 600px; 
            box-shadow: 0 -10px 30px rgba(0,0,0,0.15); 
        }
        
        .modal-title { font-size: 1.15rem; font-weight: 700; color: #1b1b1b; margin-bottom: 16px; text-align: center; }
        .option-group { margin-bottom: 16px; }
        .option-label { font-size: 0.82rem; font-weight: 600; color: #323130; margin-bottom: 6px; display: block; }
        .option-select, .notes-input { width: 100%; padding: 10px; background: #f3f2f1; color: #1b1b1b; border: 1px solid rgba(0,0,0,0.12); border-radius: 6px; font-size: 0.9rem; font-weight: 600; outline: none; }
        
        .modal-btns { display: flex; gap: 8px; margin-top: 8px; }
        .modal-btn-cancel { flex: 1; padding: 10px; background: #f3f2f1; color: #323130; border: 1px solid rgba(0,0,0,0.12); border-radius: 6px; font-weight: 600; font-size: 0.9rem; cursor: pointer; }
        .modal-btn-confirm { flex: 2; padding: 10px; background: #0078d4; color: #fff; border: none; border-radius: 6px; font-weight: 700; font-size: 0.9rem; box-shadow: 0 2px 6px rgba(0, 120, 212, 0.3); cursor: pointer; }

        /* BARRA CARRITO */
        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); padding: 14px 18px; border-top: 1px solid rgba(0, 0, 0, 0.08); display: flex; justify-content: space-between; align-items: center; z-index: 20; box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.06); }
        .btn-submit { background: #107c41; color: #fff; border: none; padding: 12px 22px; border-radius: 6px; font-weight: 700; font-size: 0.95rem; cursor: pointer; box-shadow: 0 2px 8px rgba(16, 124, 65, 0.3); }

        .cart-modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); z-index: 110; justify-content: center; align-items: flex-end; backdrop-filter: blur(5px); }
        .cart-modal.active { display: flex; }
        .cart-modal-content { background: #ffffff; border: 1px solid rgba(0, 0, 0, 0.15); border-radius: 12px 12px 0 0; padding: 22px 18px; width: 100%; max-width: 600px; max-height: 80vh; display: flex; flex-direction: column; }
        .cart-items-list { flex: 1; overflow-y: auto; margin: 12px 0; display: flex; flex-direction: column; gap: 8px; }
        .cart-row { background: #ffffff; border: 1px solid rgba(0,0,0,0.06); padding: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #0078d4; }
    </style>
</head>
<body>

    <header><img src="logo.png" class="logo" alt="El Crepero"></header>
    <div class="table-banner" id="tableBanner">Cargando Mesa...</div>

    <div class="categories-bar">
        <button class="cat-btn active" onclick="filterCat('all')">Ver Todo</button>
        <button class="cat-btn season" onclick="filterCat('temporada')">🌟 Temporada</button>
        <button class="cat-btn" onclick="filterCat('desayunos')">Desayunos</button>
        <button class="cat-btn" onclick="filterCat('saladas')">Saladas</button>
        <button class="cat-btn" onclick="filterCat('dulces')">Dulces</button>
        <button class="cat-btn" onclick="filterCat('bebidas')">Bebidas</button>
    </div>

    <div class="items-grid" id="itemsGrid"></div>

    <div class="modal" id="customModal">
        <div class="modal-content">
            <div class="modal-title" id="modalItemTitle">Prepara tu Orden</div>
            <div class="option-group" id="optGroupContainer">
                <label class="option-label">Opciones Extra:</label>
                <select class="option-select" id="customOptionSelect"></select>
            </div>
            <div class="option-group">
                <label class="option-label">Notas para la cocina:</label>
                <input type="text" class="notes-input" id="itemNotes" placeholder="Ej: Sin cebolla...">
            </div>
            <div class="modal-btns">
                <button class="modal-btn-cancel" onclick="closeModal()">Cancelar</button>
                <button class="modal-btn-confirm" onclick="confirmAddToCart()">Añadir</button>
            </div>
        </div>
    </div>

    <div class="cart-modal" id="cartModal">
        <div class="cart-modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div style="font-size:1.15rem; font-weight:700; color:#1b1b1b;">Tu Pedido Actual</div>
                <button onclick="toggleCartModal()" style="background:none; border:none; color:#605e5c; cursor:pointer;">✕</button>
            </div>
            <div class="cart-items-list" id="cartItemsList"></div>
            <button class="btn-submit" onclick="sendOrderToPOS()" style="width:100%;">Enviar Pedido 🚀</button>
        </div>
    </div>

    <div class="cart-bar">
        <div class="cart-info" onclick="toggleCartModal()">
            <span class="cart-label">Ver Pedido 🛒</span>
            <span class="cart-total" id="cartTotal">Q 0.00</span>
        </div>
        <button class="btn-submit" onclick="sendOrderToPOS()">Enviar Pedido 🚀</button>
    </div>
