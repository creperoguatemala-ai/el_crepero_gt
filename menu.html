<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menú Digital - El Crepero Win11</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: #f3f3f3;
            background-image: radial-gradient(circle at 10% 20%, rgba(0, 120, 212, 0.08) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(16, 124, 65, 0.06) 0%, transparent 40%);
            background-attachment: fixed;
            color: #202020; 
            padding-bottom: 110px; 
        }
        
        header { 
            background: rgba(243, 243, 243, 0.85); 
            backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(0, 0, 0, 0.08); 
            padding: 12px; 
            text-align: center; 
            position: sticky; 
            top: 0; 
            z-index: 20; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); 
        }
        .logo { height: 30px; }
        .table-banner { background: #0078d4; color: #fff; font-weight: 700; padding: 9px; font-size: 0.85rem; text-align: center; text-transform: uppercase; letter-spacing: 1px; }

        .categories-bar { 
            display: flex; 
            gap: 8px; 
            padding: 12px 16px; 
            overflow-x: auto; 
            background: rgba(255, 255, 255, 0.6); 
            backdrop-filter: blur(15px); 
            position: sticky; 
            top: 67px; 
            z-index: 15; 
            border-bottom: 1px solid rgba(0, 0, 0, 0.06); 
        }
        .categories-bar::-webkit-scrollbar { display: none; }
        
        .cat-btn { 
            background: #ffffff; 
            color: #323130; 
            border: 1px solid rgba(0, 0, 0, 0.1); 
            padding: 6px 16px; 
            border-radius: 6px; 
            font-weight: 600; 
            font-size: 0.82rem; 
            white-space: nowrap; 
            transition: 0.15s; 
            cursor: pointer; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .cat-btn.active { background: #0078d4; color: #fff; border-color: #0078d4; box-shadow: 0 2px 8px rgba(0, 120, 212, 0.3); }
        .cat-btn.season { background: #fde7e9; color: #a80000; border-color: #f8939c; }
        .cat-btn.season.active { background: #a80000; color: #fff; box-shadow: 0 2px 8px rgba(168, 0, 0, 0.3); }

        .items-grid { padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 14px; }
        
        .item-card { 
            background: #ffffff; 
            border: 1px solid rgba(0, 0, 0, 0.08); 
            border-radius: 8px; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            min-height: 155px; 
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03); 
        }
        .item-card.season-card { border-color: #f8939c; background: #fff9f9; }
        
        .item-title { font-weight: 700; font-size: 0.95rem; color: #1b1b1b; line-height: 1.25; margin-bottom: 4px; }
        .item-desc { font-size: 0.72rem; font-weight: 400; color: #605e5c; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px; }
        .item-price { color: #d83b01; font-weight: 700; font-size: 1.05rem; }
        .btn-add { background: #0078d4; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: 700; width: 100%; margin-top: 8px; font-size: 0.88rem; cursor: pointer; box-shadow: 0 2px 6px rgba(0, 120, 212, 0.3); transition: 0.15s; }
        .btn-add:hover { background: #106ebe; }

        /* MODAL Win11 Flyout */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); z-index: 100; justify-content: center; align-items: flex-end; backdrop-filter: blur(5px); }
        .modal.active { display: flex; }
        .modal-content { 
            background: #ffffff; 
            border: 1px solid rgba(0, 0, 0, 0.15); 
            border-radius: 12px 12px 0 0; 
            padding: 22px 18px; 
            width: 100%; 
            max-width: 600px; 
            box-shadow: 0 -10px 30px rgba(0,0,0,0.15); 
            animation: slideUp 0.2s ease; 
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .modal-title { font-size: 1.15rem; font-weight: 700; color: #1b1b1b; margin-bottom: 16px; text-align: center; }
        .option-group { margin-bottom: 16px; }
        .option-label { font-size: 0.82rem; font-weight: 600; color: #323130; margin-bottom: 6px; display: block; }
        .option-select, .notes-input { width: 100%; padding: 10px; background: #f3f2f1; color: #1b1b1b; border: 1px solid rgba(0,0,0,0.12); border-radius: 6px; font-size: 0.9rem; font-weight: 600; outline: none; }
        
        .modal-btns { display: flex; gap: 8px; margin-top: 8px; }
        .modal-btn-cancel { flex: 1; padding: 10px; background: #f3f2f1; color: #323130; border: 1px solid rgba(0,0,0,0.12); border-radius: 6px; font-weight: 600; font-size: 0.9rem; cursor: pointer; }
        .modal-btn-confirm { flex: 2; padding: 10px; background: #0078d4; color: #fff; border: none; border-radius: 6px; font-weight: 700; font-size: 0.9rem; box-shadow: 0 2px 6px rgba(0, 120, 212, 0.3); cursor: pointer; }

        /* BARRA INFERIOR DE CARRITO */
        .cart-bar { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(20px); 
            padding: 14px 18px; 
            border-top: 1px solid rgba(0, 0, 0, 0.08); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 20; 
            box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.06); 
        }
        .cart-info { display: flex; flex-direction: column; cursor: pointer; }
        .cart-label { font-size: 0.7rem; font-weight: 600; color: #605e5c; text-transform: uppercase; letter-spacing: 0.5px; }
        .cart-total { font-size: 1.4rem; font-weight: 700; color: #d83b01; line-height: 1; margin-top: 2px; }
        .btn-submit { background: #107c41; color: #fff; border: none; padding: 12px 22px; border-radius: 6px; font-weight: 700; font-size: 0.95rem; cursor: pointer; box-shadow: 0 2px 8px rgba(16, 124, 65, 0.3); transition: 0.15s; }
        .btn-submit:hover { background: #0e703b; }

        /* MODAL DE RESUMEN DE CARRITO */
        .cart-modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); z-index: 110; justify-content: center; align-items: flex-end; backdrop-filter: blur(5px); }
        .cart-modal.active { display: flex; }
        .cart-modal-content { 
            background: #ffffff; 
            border: 1px solid rgba(0, 0, 0, 0.15); 
            border-radius: 12px 12px 0 0; 
            padding: 22px 18px; 
            width: 100%; 
            max-width: 600px; 
            max-height: 80vh; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 -10px 30px rgba(0,0,0,0.15); 
        }
        .cart-items-list { flex: 1; overflow-y: auto; margin: 12px 0; display: flex; flex-direction: column; gap: 8px; }
        .cart-row { background: #ffffff; border: 1px solid rgba(0,0,0,0.06); padding: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #0078d4; }
        .cart-row-info { flex: 1; }
        .cart-row-title { font-weight: 600; font-size: 0.88rem; color: #1b1b1b; }
        .cart-row-price { font-weight: 500; font-size: 0.75rem; color: #605e5c; margin-top: 2px; }
        .cart-row-controls { display: flex; align-items: center; gap: 6px; }
    </style>
</head>
<body>

    <header><img src="logo.png" class="logo" alt="El Crepero"></header>
    <div class="table-banner" id="tableBanner">Cargando Mesa...</div>

    <div class="categories-bar">
        <button class="cat-btn active" onclick="filterCat('all')">Ver Todo</button>
        <button class="cat-btn season" onclick="filterCat('temporada')">🌟 Temporada</button>
        <button class="cat-btn" onclick="filterCat('desayunos')">Desayunos</button>
        <button class="cat-btn" onclick="filterCat('saladas')">Saladas</button>
        <button class="cat-btn" onclick="filterCat('dulces')">Dulces</button>
        <button class="cat-btn" onclick="filterCat('bebidas')">Bebidas</button>
    </div>

    <div class="items-grid" id="itemsGrid"></div>

    <div class="modal" id="customModal">
        <div class="modal-content">
            <div class="modal-title" id="modalItemTitle">Prepara tu Orden</div>
            <div class="option-group" id="optGroupContainer">
                <label class="option-label">Opciones Extra:</label>
                <select class="option-select" id="customOptionSelect"></select>
            </div>
            <div class="option-group">
                <label class="option-label">Notas para la cocina (Opcional):</label>
                <input type="text" class="notes-input" id="itemNotes" placeholder="Ej: Sin cebolla, extra tostado...">
            </div>
            <div class="modal-btns">
                <button class="modal-btn-cancel" onclick="closeModal()">Cancelar</button>
                <button class="modal-btn-confirm" onclick="confirmAddToCart()">Añadir al Carrito</button>
            </div>
        </div>
    </div>

    <div class="cart-modal" id="cartModal">
        <div class="cart-modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div style="font-size:1.15rem; font-weight:700; color:#1b1b1b;">Tu Pedido Actual</div>
                <button onclick="toggleCartModal()" style="background:none; border:none; color:#605e5c; font-size:1.3rem; font-weight:bold; cursor:pointer;">✕</button>
            </div>
            <div class="cart-items-list" id="cartItemsList"></div>
            <button class="btn-submit" onclick="sendOrderToPOS()" style="width:100%;">Enviar Pedido a Cocina 🚀</button>
        </div>
    </div>

    <div class="cart-bar">
        <div class="cart-info" onclick="toggleCartModal()">
            <span class="cart-label">Ver Pedido (<span id="cartCount">0</span> items) 🛒</span>
            <span class="cart-total" id="cartTotal">Q 0.00</span>
        </div>
        <button class="btn-submit" onclick="sendOrderToPOS()">Enviar Pedido 🚀</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDlU2dB12caXrez3UXj0v4ojl893_sDWK8",
            authDomain: "elcrepero-1752a.firebaseapp.com",
            databaseURL: "https://elcrepero-1752a-default-rtdb.firebaseio.com",
            projectId: "elcrepero-1752a",
            storageBucket: "elcrepero-1752a.firebasestorage.app",
            messagingSenderId: "327079955432",
            appId: "1:327079955432:web:49e17e765625b70fdcf25d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const tableId = parseInt(urlParams.get('mesa')) || 1;
        document.getElementById('tableBanner').innerText = `ORDENANDO PARA MESA ${tableId}`;

        const fruitOptions = [
            { label: 'Sin fruta extra (+Q0)', priceAdd: 0 },
            { label: 'Con Banano (+Q5.00)', priceAdd: 5 },
            { label: 'Con Fresa (+Q5.00)', priceAdd: 5 },
            { label: 'Con Melocotón (+Q5.00)', priceAdd: 5 }
        ];

        const menu = [
            { id: 101, cat: 'temporada', name: 'Crepa Cucurucho', desc: 'Nutella fresa + dulce típico a elección', price: 45, optionsObj: [{ label: 'Canillita de Leche', priceAdd: 0 }, { label: 'Cocada de Piña', priceAdd: 0 }, { label: 'Colocho de Guayaba', priceAdd: 0 }] },
            { id: 102, cat: 'temporada', name: 'Crep Rose', desc: 'Betún de queso crema con jalea de fresa', price: 45 },
            { id: 103, cat: 'temporada', name: 'Crepa Churrasquito', desc: 'Mozzarella, carne, cebolla, chimichurri + bebida', price: 75, optionsObj: [{ label: 'Con Coca-Cola', priceAdd: 0 }, { label: 'Con Cerveza', priceAdd: 0 }] },
            { id: 104, cat: 'temporada', name: 'Crepa Lotus Biscoff', desc: 'Salsa Speculoos con helado de vainilla', price: 60, optionsObj: fruitOptions },
            { id: 105, cat: 'temporada', name: 'Crepa Lemon Cookies', desc: 'Choc. blanco con limón, galleta y helado', price: 55, optionsObj: fruitOptions },
            { id: 106, cat: 'temporada', name: 'Crepa Raffaello', desc: 'Salsa choc. blanco y coco con helado', price: 60, optionsObj: fruitOptions },
            { id: 107, cat: 'temporada', name: 'Crepa Choco Coffee Crunch', desc: 'Chocolate con trozos de café y helado', price: 55, optionsObj: fruitOptions },
            { id: 108, cat: 'bebidas', name: 'Refresher Maracuyá', desc: 'Pulpa de maracuyá, ginger ale, jugo piña', price: 22 },
            { id: 1, cat: 'desayunos', name: 'Desayuno El Crepero', desc: 'Huevos, frijol, plátanos, crema, café', price: 45 },
            { id: 2, cat: 'desayunos', name: 'Bagel Pavo y Fruta', desc: 'Queso, jamón pavo, ranch, fruta, café', price: 42 },
            { id: 3, cat: 'desayunos', name: 'Toast Tocino y Yogurt', desc: 'Aguacate, tocino, yogurt, fruta, café', price: 40 },
            { id: 4, cat: 'desayunos', name: 'Toast Huevo y Fruta', desc: 'Queso crema, tomate, jamón, huevo, café', price: 40 },
            { id: 5, cat: 'desayunos', name: 'Panqueques Nutella', desc: '3 panqueques con Nutella, fruta, café', price: 38 },
            { id: 6, cat: 'desayunos', name: 'Waffles con Fruta', desc: '3 waffles con Nutella, fruta, café', price: 40 },
            { id: 7, cat: 'saladas', name: 'Crepa Jamón y Queso', desc: 'Jamón de pavo y queso mozzarella', price: 44 },
            { id: 8, cat: 'saladas', name: 'Crepa Pesto y Queso', desc: 'Salsa pesto, parmesano, piñones', price: 45 },
            { id: 9, cat: 'saladas', name: 'Crepa Pollo y Pesto', desc: 'Pollo, salsa pesto, parmesano, mozzarella', price: 50 },
            { id: 10, cat: 'saladas', name: 'Crepa Margarita', desc: 'Salsa artesanal, mozzarella, tomate', price: 48 },
            { id: 11, cat: 'saladas', name: 'Crepa Chorizo y Queso', desc: 'Chorizo argentino premium y mozzarella', price: 49 },
            { id: 12, cat: 'saladas', name: 'Crepizza Jam', desc: 'Salsa artesanal, mozzarella, jamón pavo', price: 48 },
            { id: 13, cat: 'dulces', name: 'Nutella Lover', desc: 'Nutella pura', price: 34 },
            { id: 14, cat: 'dulces', name: 'Nutella Banano', desc: 'Nutella y banano', price: 35 },
            { id: 15, cat: 'dulces', name: 'Nutella Fresa', desc: 'Nutella y fresa', price: 37 },
            { id: 16, cat: 'dulces', name: 'Nutella Melocotón', desc: 'Nutella y melocotón', price: 40 },
            { id: 17, cat: 'dulces', name: 'Nutella Mixta', desc: 'Nutella, banano, fresa y melocotón', price: 45 },
            { id: 18, cat: 'dulces', name: 'Pistacho Crunch', desc: 'Crema de pistacho', price: 33 },
            { id: 19, cat: 'dulces', name: 'Pistacho Banano', desc: 'Crema de pistacho y banano', price: 34 },
            { id: 20, cat: 'dulces', name: 'Pistacho Fresa', desc: 'Crema de pistacho y fresa', price: 37 },
            { id: 21, cat: 'dulces', name: 'Pistacho Melocotón', desc: 'Crema de pistacho y melocotón', price: 40 },
            { id: 22, cat: 'dulces', name: 'Pistacho Mixta', desc: 'Pistacho, banano, fresa, melocotón y nueces', price: 46 },
            { id: 23, cat: 'dulces', name: 'Dulce Leche Base', desc: 'Dulce de leche solo', price: 31 },
            { id: 24, cat: 'dulces', name: 'Dulce Leche Banano', desc: 'Dulce de leche y banano', price: 34 },
            { id: 25, cat: 'dulces', name: 'Dulce Leche Fresa', desc: 'Dulce de leche y fresa', price: 35 },
            { id: 26, cat: 'dulces', name: 'Dulce Leche Melocotón', desc: 'Dulce de leche y melocotón', price: 38 },
            { id: 27, cat: 'dulces', name: 'Dulce Leche Mixta', desc: 'Dulce de leche, banano, fresa y melocotón', price: 43 },
            { id: 28, cat: 'dulces', name: 'Strawberry Cream', desc: 'Mermelada de fresa y queso crema', price: 40 },
            { id: 29, cat: 'dulces', name: 'Colombianita', desc: 'Nutella y queso mozzarella', price: 40 },
            { id: 30, cat: 'bebidas', name: 'Café Negro', desc: 'Caliente', price: 10, options: ['Leche entera', 'Leche descremada'] },
            { id: 31, cat: 'bebidas', name: 'Café con Leche', desc: 'Caliente', price: 15, options: ['Entera', 'Descremada'] },
            { id: 32, cat: 'bebidas', name: 'Coffee Ice', desc: 'Frío', price: 25 },
            { id: 33, cat: 'bebidas', name: 'Copa de Vino', desc: 'Tinto/Blanco', price: 20 },
            { id: 34, cat: 'bebidas', name: 'Té de la Casa', desc: 'Infusión', price: 12 },
            { id: 35, cat: 'bebidas', name: 'Coca Cola', desc: 'Lata/Botella', price: 12 },
            { id: 36, cat: 'bebidas', name: 'Jamaica', desc: 'Bebida fría', price: 15, options: ['Con azúcar', 'Sin azúcar'] },
            { id: 37, cat: 'bebidas', name: 'Cerveza Moza', desc: 'Cerveza', price: 18 }
        ];

        let cart = [];
        let selectedItem = null;
        let currentCat = 'all';

        window.renderMenu = function() {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = '';
            const filtered = currentCat === 'all' ? menu : menu.filter(i => i.cat === currentCat);
            
            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = `item-card ${item.cat === 'temporada' ? 'season-card' : ''}`;
                card.onclick = () => handleItemClick(item);
                card.innerHTML = `
                    <div>
                        <div class="item-title">${item.name}</div>
                        <div class="item-desc">${item.desc}</div>
                    </div>
                    <div>
                        <div class="item-price">Q ${item.price.toFixed(2)}</div>
                        <button class="btn-add">Añadir</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        };

        window.filterCat = function(cat) {
            currentCat = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');
            renderMenu();
        };

        function handleItemClick(item) {
            selectedItem = item;
            document.getElementById('modalItemTitle').innerText = item.name;
            document.getElementById('itemNotes').value = '';

            const container = document.getElementById('optGroupContainer');
            const select = document.getElementById('customOptionSelect');

            if (item.optionsObj && item.optionsObj.length > 0) {
                container.style.display = 'block';
                select.innerHTML = item.optionsObj.map((opt, idx) => `<option value="${idx}">${opt.label}</option>`).join('');
            } else if (item.options && item.options.length > 0) {
                container.style.display = 'block';
                select.innerHTML = item.options.map(opt => `<option value="${opt}">${opt}</option>`).join('');
            } else {
                container.style.display = 'none';
            }
            document.getElementById('customModal').classList.add('active');
        }

        window.closeModal = function() { document.getElementById('customModal').classList.remove('active'); };

        window.confirmAddToCart = function() {
            const select = document.getElementById('customOptionSelect');
            const notes = document.getElementById('itemNotes').value.trim();
            
            let finalPrice = selectedItem.price;
            let optionsText = '';

            if (selectedItem.optionsObj && selectedItem.optionsObj.length > 0) {
                const optObj = selectedItem.optionsObj[select.value];
                finalPrice += optObj.priceAdd;
                optionsText = optObj.label;
            } else if (selectedItem.options && selectedItem.options.length > 0) {
                optionsText = select.value;
            }

            if (notes) optionsText += (optionsText ? ' | ' : '') + notes;
            const fullName = optionsText ? `${selectedItem.name} (${optionsText})` : selectedItem.name;

            const existing = cart.find(i => i.name === fullName);
            if (existing) existing.qty++;
            else cart.push({ name: fullName, price: finalPrice, qty: 1 });

            closeModal();
            updateCartUI();
        };

        window.updateCartQty = function(name, delta) {
            const item = cart.find(i => i.name === name);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) cart = cart.filter(i => i.name !== name);
            }
            updateCartUI();
        };

        function updateCartUI() {
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
            
            document.getElementById('cartTotal').innerText = `Q ${total.toFixed(2)}`;
            document.getElementById('cartCount').innerText = totalCount;

            const list = document.getElementById('cartItemsList');
            list.innerHTML = '';
            cart.forEach(item => {
                const row = document.createElement('div');
                row.className = 'cart-row';
                row.innerHTML = `
                    <div class="cart-row-info">
                        <div class="cart-row-title">${item.name}</div>
                        <div class="cart-row-price">Q ${item.price.toFixed(2)} c/u</div>
                    </div>
                    <div class="cart-row-controls">
                        <button onclick="updateCartQty('${item.name}', -1)" style="width:24px; height:24px; border-radius:4px; border:1px solid rgba(0,0,0,0.12); background:#ffffff; color:#1b1b1b; font-weight:700;">-</button>
                        <span style="font-weight:700; min-width:16px; text-align:center; color:#1b1b1b;">${item.qty}</span>
                        <button onclick="updateCartQty('${item.name}', 1)" style="width:24px; height:24px; border-radius:4px; border:1px solid rgba(0,0,0,0.12); background:#ffffff; color:#1b1b1b; font-weight:700;">+</button>
                    </div>
                `;
                list.appendChild(row);
            });
        }

        window.toggleCartModal = function() {
            document.getElementById('cartModal').classList.toggle('active');
        };

        window.sendOrderToPOS = async function() {
            if (cart.length === 0) { alert('Tu carrito está vacío.'); return; }

            const tableRef = ref(db, `mesas_activas/${tableId}`);
            const snapshot = await get(tableRef);
            let currentData = snapshot.val() || { items: [] };

            const updatedItems = [...(currentData.items || []), ...cart];
            await set(tableRef, { items: updatedItems, startTime: currentData.startTime || new Date().toISOString() });

            alert('¡Tu pedido ha sido enviado a la cocina con éxito!');
            cart = [];
            toggleCartModal();
            updateCartUI();
        };

        renderMenu();
    </script>
</body>
</html>
